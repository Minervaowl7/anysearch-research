name: Package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: anysearch-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_package.py
        working-directory: anysearch-research
      - run: python -m unittest discover -s tests -v
        working-directory: anysearch-research
      - run: python tools/build_package.py --output ../anysearch-research.zip
        working-directory: anysearch-research
